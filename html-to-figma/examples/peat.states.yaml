# PEAT alignment prototype: every view, and the survey clicked through once.
# Run: python3 scripts/html_to_figma.py examples/peat.states.yaml
page: "~/Downloads/PEAT · Alignment prototype · Innovation Growth Lab.html"
out: ~/Downloads/peat-figma
width: 1147          # layout width of the hand-made captures (peat-setup.svg)
scale: 2
hide:
  - .proto           # "Prototype controls" panel: not part of the design

states:
  - name: setup
    hash: "#setup"

  - name: setup-outcomes
    hash: "#setup"
    actions:
      - click: '[data-next="0"]'

  - name: setup-forecast
    hash: "#setup"
    actions:
      - click: '#su-stepbar [data-step="2"]'

  - name: setup-invite
    hash: "#setup"
    actions:
      - click: '#su-stepbar [data-step="3"]'

  - name: survey-intro
    hash: "#survey"

  - name: survey-outcome-1
    hash: "#survey"
    actions:
      - click: '[data-sv="start"]'
      - fill: { selector: '[data-a="b"]', value: 30 }
      - fill: { selector: '[data-a="lo"]', value: 20 }
      - fill: { selector: '[data-a="hi"]', value: 40 }
      - select: { selector: '[data-a="t"]', value: "12" }
      - fill: { selector: '[data-a="why"]', value: "Take-up was about this high in the last two pilots." }
      - wait: '#sv-line circle'

  - name: survey-outcome-2
    hash: "#survey"
    actions:
      - click: '[data-sv="start"]'
      - fill: { selector: '[data-a="b"]', value: 30 }
      - fill: { selector: '[data-a="lo"]', value: 20 }
      - fill: { selector: '[data-a="hi"]', value: 40 }
      - select: { selector: '[data-a="t"]', value: "12" }
      - click: '[data-sv="next"]'
      - wait: 'h3:has-text("Share adopting")'
      - fill: { selector: '[data-a="b"]', value: 50 }
      - fill: { selector: '[data-a="lo"]', value: 35 }
      - fill: { selector: '[data-a="hi"]', value: 65 }
      - select: { selector: '[data-a="t"]', value: "18" }

  - name: survey-outcome-3
    hash: "#survey"
    actions:
      - click: '[data-sv="start"]'
      - fill: { selector: '[data-a="b"]', value: 30 }
      - fill: { selector: '[data-a="lo"]', value: 20 }
      - fill: { selector: '[data-a="hi"]', value: 40 }
      - select: { selector: '[data-a="t"]', value: "12" }
      - click: '[data-sv="next"]'
      - wait: 'h3:has-text("Share adopting")'
      - fill: { selector: '[data-a="b"]', value: 50 }
      - fill: { selector: '[data-a="lo"]', value: 35 }
      - fill: { selector: '[data-a="hi"]', value: 65 }
      - select: { selector: '[data-a="t"]', value: "18" }
      - click: '[data-sv="next"]'
      - wait: 'h3:has-text("main performance measure")'
      - fill: { selector: '[data-a="b"]', value: 3 }
      - fill: { selector: '[data-a="lo"]', value: -1 }
      - fill: { selector: '[data-a="hi"]', value: 7 }
      - select: { selector: '[data-a="t"]', value: "36" }

  - name: survey-done
    hash: "#survey"
    actions:
      - click: '[data-sv="start"]'
      - fill: { selector: '[data-a="b"]', value: 30 }
      - fill: { selector: '[data-a="lo"]', value: 20 }
      - fill: { selector: '[data-a="hi"]', value: 40 }
      - select: { selector: '[data-a="t"]', value: "12" }
      - click: '[data-sv="next"]'
      - fill: { selector: '[data-a="b"]', value: 50 }
      - fill: { selector: '[data-a="lo"]', value: 35 }
      - fill: { selector: '[data-a="hi"]', value: 65 }
      - select: { selector: '[data-a="t"]', value: "18" }
      - click: '[data-sv="next"]'
      - fill: { selector: '[data-a="b"]', value: 3 }
      - fill: { selector: '[data-a="lo"]', value: -1 }
      - fill: { selector: '[data-a="hi"]', value: 7 }
      - select: { selector: '[data-a="t"]', value: "36" }
      - click: '[data-sv="next"]'
      - wait: 'button[data-sv="restart"]'

  - name: alignment
    hash: "#alignment"

  - name: followup
    hash: "#followup"
